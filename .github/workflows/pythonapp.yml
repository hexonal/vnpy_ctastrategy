name: Python application

on: [push]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ta-lib==0.6.4 --index=https://pypi.vnpy.com
        pip install vnpy ruff mypy uv
    - name: Lint with ruff
      run: |
        # Run ruff linter based on pyproject.toml configuration
        ruff check .
    - name: Type check with mypy
      run: |
        # Run mypy type checking based on pyproject.toml configuration
        mypy vnpy_ctastrategy
    # 本仓测试有 4 处 import vnpy_gatewaykit。该仓此前私有、CI 装不到，
    # 所以 578 个用例一直没进 CI；它现在已公开，用 runner 自带的
    # GITHUB_TOKEN 就能 checkout，不需要 PAT。
    - name: Checkout vnpy_gatewaykit
      uses: actions/checkout@v7
      with:
        repository: hexonal/vnpy_gatewaykit
        path: _deps/vnpy_gatewaykit

    - name: Test
      run: |
        pip install pytest
        pip install -e _deps/vnpy_gatewaykit
        # 本仓自己也要装：CI 原先只装 `vnpy ruff mypy uv`，从不装本包，
        # 所以 import vnpy_ctastrategy 会 ModuleNotFoundError。
        # mypy/ruff 走文件路径不受影响，正因如此这个缺口一直没被发现。
        pip install -e .
        # scipy 在本包运行时是可选的（sharpe_inference.py 用 try/except 导入，
        # 缺了就退化成正态近似），但测试要验的正是 t 分布与卡方分布那两条路径，
        # 所以 CI 必须装上，否则收集阶段就 ModuleNotFoundError。
        pip install scipy
        pytest tests -q

    - name: Build packages with uv
      run: |
        # Build source distribution and wheel distribution
        uv build
