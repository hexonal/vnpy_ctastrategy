[project]
name = "vnpy_ctastrategy"
dynamic = ["version"]
description = "CTA strategy application for VeighNa quant trading framework."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Xiaoyou Chen", email = "xiaoyou.chen@mail.vnpy.com"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: Implementation :: CPython",
    "Natural Language :: Chinese (Simplified)",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "vnpy>=4.4.0",
    # Backtest windows are read through gatewaykit's query_window, which reads
    # exchange -> market timezone out of the same market_clock table the
    # gateways localize incoming bars with. Duplicating that map here would give
    # the project two sources of truth for what "2024-01-26" means, which is the
    # class of bug query_window exists to close — and the replay gateway and the
    # data-manager GUI need the identical reading, so it lives in the kit all
    # three already depend on rather than in any one of them.
    "vnpy_gatewaykit>=0.1.0",
    "pandas",
    "plotly",
]
keywords = ["quant", "quantitative", "investment", "trading", "algotrading"]

[project.urls]
"Homepage" = "https://www.vnpy.com"
"Documentation" = "https://www.vnpy.com/docs"
"Changes" = "https://github.com/vnpy/vnpy_ctastrategy/blob/master/CHANGELOG.md"
"Source" = "https://github.com/vnpy/vnpy_ctastrategy/"
"Forum" = "https://www.vnpy.com/forum"

[build-system]
requires = ["hatchling>=1.27.0", "babel>=2.17.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "vnpy_ctastrategy/__init__.py"
pattern = "__version__ = ['\"](?P<version>[^'\"]+)['\"]"

[tool.hatch.build.targets.wheel]
packages = ["vnpy_ctastrategy"]
include-package-data = true

[tool.hatch.build.targets.sdist]
include = ["vnpy_ctastrategy*"]

[tool.hatch.build.hooks.custom]
path = "vnpy_ctastrategy/locale/build_hook.py"

[tool.hatch.build.targets.wheel.force-include]
"vnpy_ctastrategy/locale/en/LC_MESSAGES/vnpy_ctastrategy.mo" = "vnpy_ctastrategy/locale/en/LC_MESSAGES/vnpy_ctastrategy.mo"

[tool.ruff]
target-version = "py310"
output-format = "full"

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "I",  # isort
    "SIM",  # flake8-simplify
    "UP",  # pyupgrade
    "W",  # pycodestyle warning
]
ignore = ["E501"]

[tool.mypy]
# 3.12 而不是上面 requires-python 的 3.10 —— 这不是放宽，是让检查真的发生。
#
# numpy 的存根用了 PEP 695 的 `type X = ...`（3.12+）。按 3.10 解析它会得到
# 一个语法错，mypy 随即打印 "errors prevented further checking" 并退出 1 ——
# 于是 CI 的类型检查这一步长期**一行本仓代码都没检查过**，只是稳定地红着。
# （numpy 2.5.1 自身 requires-python 就是 >=3.12，两个版本约束本就不可能同时成立。）
#
# 代价说清楚：mypy 不再校验 3.10/3.11 的兼容性。语法层面的版本兼容由
# ruff 的 target-version = "py310" 兜着；真要保证 3.10 可跑，得靠一条
# 在 3.10 上装老 numpy 的 CI 矩阵，那是另一件事。
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true

# Point pyright at the shared VeighNa virtualenv. Without it, every vnpy import
# resolves against the system interpreter and reports as unresolved, burying the
# real diagnostics. Relative so it travels with the checkout: this fork sits
# beside the vnpy fork that owns the venv.
[tool.pyright]
venvPath = ".."
venv = "vnpy/.venv"
typeCheckingMode = "standard" 